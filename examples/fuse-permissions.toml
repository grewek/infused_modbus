# Optional --fuse-permissions example — see the "FUSE directory
# permissions" section in the top-level README.md. Applies identically to
# every machine's own subtree (there is no per-machine override): with
# this file, every machine's transactions/ is locked down to its owner
# only, and report/ stays world-readable but not writable by anything
# other than the process itself.

[transactions]
mode = 0o700

[report]
mode = 0o444
