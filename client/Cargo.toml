[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol" }
fuse-fs = { path = "../fuse-fs" }
fuser = "0.18"
tokio = { version = "1", features = [
    "io-util",
    "time",
    "rt-multi-thread",
    "net",
    "signal",
    "macros",
    "sync",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
